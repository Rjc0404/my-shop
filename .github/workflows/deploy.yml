name: 自动打包并部署到腾讯云

on:
  push:
    branches:
      - main   # 如果你的默认分支叫 master，这里改成 master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取最新代码
      - name: Checkout 代码
        uses: actions/checkout@v4

      # 2. 准备 Node 环境
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. 安装依赖并打包
      - name: 打包项目
        run: |
          npm install
          npm run build

      # 4. 自动把 dist 传到腾讯云 Nginx 目录
      - name: 上传 dist 到腾讯云
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "dist/*"
          target: "/var/www/dist"
          strip_components: 0